name: eval
# Daily: run every available GitHub Models model on the benchmark (resumable, so free-tier daily quotas are
# fine: unfinished questions are picked up the next day), rebuild the report and commit it.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated provider specs, or 'auto'"
        default: "auto"
permissions:
  contents: write
  models: read
concurrency:
  group: eval
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Groq's free tier is used when the repository has a GROQ_API_KEY secret; otherwise GitHub Models.
      # groq/auto asks Groq which chat models it serves today, so retired models drop out by themselves.
      GROQ_MODELS: groq/auto:5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: sqleval build
      - name: Harness self-check (gold queries must score 100%)
        run: |
          sqleval run --model gold --variant context --out /tmp/gold
          test "$(grep -c '"correct": true' /tmp/gold/gold@context.jsonl)" = "50"
      - name: Models with business context
        run: |
          models="${{ github.event.inputs.models || 'auto' }}"
          if [ "$models" = "auto" ] && [ -n "$GROQ_API_KEY" ]; then models="$GROQ_MODELS"; fi
          args=""
          for m in $models; do args="$args --model $m"; done
          set -o pipefail
          sqleval run $args --variant context --budget-minutes 80 2>&1 | tee run.log || { echo "::error title=eval failed::$(tail -c 3000 run.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Ablation without context (two models)
        run: |
          set -o pipefail
          if [ -n "$GROQ_API_KEY" ]; then a="--model groq/auto:2";
          else a="--model github/openai/gpt-4.1-mini --model github/openai/gpt-4o-mini"; fi
          sqleval run $a --variant schema --budget-minutes 25 2>&1 | tee abl.log || { echo "::error title=ablation failed::$(tail -c 3000 abl.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Report
        if: always()
        run: sqleval report -o results/report.json
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then echo "no new results"; exit 0; fi
          git commit -m "eval results $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
